name: Verify Windows build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean DirectoryStructureGeneratorGUI.spec

      - name: Package test build
        shell: pwsh
        run: |
          Copy-Item README.md "dist/DirectoryStructureGeneratorGUI/README.md"
          Compress-Archive `
            -Path "dist/DirectoryStructureGeneratorGUI/*" `
            -DestinationPath "DirectoryStructureGeneratorGUI_Ver2.5.0_TestBuild_Windows_x64.zip" `
            -Force

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DirectoryStructureGeneratorGUI-Ver2.5.0-TestBuild-Windows-x64
          path: DirectoryStructureGeneratorGUI_Ver2.5.0_TestBuild_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14
