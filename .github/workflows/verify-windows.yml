name: Verify Windows build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Read application version
        id: app-version
        shell: pwsh
        run: |
          $version = python -c "from dsg_app.version import APP_VERSION; print(APP_VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean DirectoryStructureGeneratorGUI.spec

      - name: Package test build
        shell: pwsh
        run: |
          $version = "${{ steps.app-version.outputs.version }}"
          Copy-Item README.md "dist/DirectoryStructureGeneratorGUI/README.md"
          Compress-Archive `
            -Path "dist/DirectoryStructureGeneratorGUI/*" `
            -DestinationPath "DirectoryStructureGeneratorGUI_Ver${version}_TestBuild_Windows_x64.zip" `
            -Force

      - name: Upload test build
        uses: actions/upload-artifact@v4
        with:
          name: DirectoryStructureGeneratorGUI-Ver${{ steps.app-version.outputs.version }}-TestBuild-Windows-x64
          path: DirectoryStructureGeneratorGUI_Ver${{ steps.app-version.outputs.version }}_TestBuild_Windows_x64.zip
          if-no-files-found: error
          retention-days: 14
