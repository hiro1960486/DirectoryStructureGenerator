name: Build and publish Windows release

on:
  push:
    branches:
      - release/v2.7.0-publish
  workflow_dispatch:
    inputs:
      version:
        description: Release tag such as v2.7.0
        required: true
        default: v2.7.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean DirectoryStructureGeneratorGUI.spec

      - name: Package and calculate SHA256
        shell: pwsh
        run: |
          $version = "2.7.0"
          $zip = "DirectoryStructureGeneratorGUI_Ver${version}_Windows_x64.zip"
          Copy-Item README.md "dist/DirectoryStructureGeneratorGUI/README.md"
          Compress-Archive -Path "dist/DirectoryStructureGeneratorGUI/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          Set-Content -LiteralPath "$zip.sha256.txt" -Encoding utf8 -Value "$zip  $hash"

      - name: Create GitHub release and upload files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "2.7.0"
          $tag = "v$version"
          $zip = "DirectoryStructureGeneratorGUI_Ver${version}_Windows_x64.zip"
          $assets = @($zip, "$zip.sha256.txt")
          $manual = "docs/DirectoryStructureGenerator_Ver${version}_操作マニュアル.pdf"
          if (Test-Path -LiteralPath $manual) {
            $assets += $manual
          } else {
            Write-Host "Ver.$version manual is not available yet; publishing ZIP and SHA256 only."
          }
          git tag "$tag" 2>$null
          git push origin "$tag"
          gh release create "$tag" `
            $assets `
            --title "Directory Structure Generator Ver.$version" `
            --notes-file "RELEASE_NOTES_v${version}.md" `
            --latest
