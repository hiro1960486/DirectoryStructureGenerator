name: Build and publish Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag such as v2.3.0
        required: true
        default: v2.3.0

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean DirectoryStructureGeneratorGUI.spec

      - name: Package and calculate SHA256
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}".TrimStart('v')
          $zip = "DirectoryStructureGeneratorGUI_Ver${version}_Windows_x64.zip"
          Copy-Item README.md "dist/DirectoryStructureGeneratorGUI/README.md"
          Compress-Archive -Path "dist/DirectoryStructureGeneratorGUI/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          Set-Content -LiteralPath "$zip.sha256.txt" -Encoding utf8 -Value "$zip  $hash"

      - name: Create GitHub release and upload files
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.version }}".TrimStart('v')
          $zip = "DirectoryStructureGeneratorGUI_Ver${version}_Windows_x64.zip"
          git tag "${{ inputs.version }}" 2>$null
          git push origin "${{ inputs.version }}"
          gh release create "${{ inputs.version }}" `
            $zip "$zip.sha256.txt" `
            "docs/DirectoryStructureGenerator_Ver${version}_操作マニュアル.pdf" `
            --title "Directory Structure Generator Ver.${version}" `
            --notes-file "RELEASE_NOTES_v${version}.md" `
            --latest
